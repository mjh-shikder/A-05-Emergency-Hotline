<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emergency Hotline</title>
    <!-- DaisyUi CDN-->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <!-- Tailwind CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font awesome cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
      integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- CSS File -->
    <link rel="stylesheet" href="./styles/style.css" />

    <!-- favicon -->
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon" />
  </head>
  <!-- Body Start -->
  <body>
    <header class="max-w-[100vw] md:max-w-[90vw] mx-auto">
      <nav class="my-3 mx-2.5">
        <div class="flex justify-between items-center">
          <div class="flex items-center md:gap-5 gap-1.5">
            <img
              class="md:w-[50px] w-[40px]"
              src="./assets/logo.png"
              alt="Logo"
            />
            <h1
              class="md:text-xl md:font-extrabold font-semibold text-[#006747]"
            >
              Emergency <br />
              Service
            </h1>
          </div>
          <div class="flex items-center md:gap-5 gap-1">
            <div
              class="flex items-center gap-3.5 bg-[#edfff1] md:py-2.5 md:px-5 rounded-full p-2.5"
            >
              <p class="font-extrabold">0</p>
              <img class="w-[25px]" src="./assets/heart.png" alt="heart icon" />
            </div>
            <div
              class="flex items-center gap-3.5 bg-[#edfff1] md:py-2.5 md:px-5 rounded-full p-2.5"
            >
              <p class="font-extrabold">100</p>
              <img class="w-[25px]" src="./assets/coin.png" alt="coin icon" />
            </div>
            <div>
              <button
                class="bg-[#00a63e] font-semibold text-white md:py-2.5 md:px-7 p-2.5 rounded-full"
              >
                <span>2</span> Copy
              </button>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main class="max-w-[100vw] mx-auto">
      <section class="">
        <div id="radial-gradiant" class=" text-center py-7">
          <img class="w-[90px] mx-auto" src="./assets/logo-dark.png" alt="Banner Logo" />
          <h1 class="hind-madurai-bold text-2xl text-white mt-3.5">জরুরি সেবা ডিরেক্টরি</h1>
          <p class="text-white hind-madurai-semibold mt-3.5">
            Government Emergency Services at Your Fingertip – A Project by
            Government of the People’s Republic of Bangladesh
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
